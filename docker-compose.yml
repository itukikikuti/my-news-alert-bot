services:
  news-bot:
    build: .
    container_name: my-news-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - STATE_FILE=/data/state.json
      - IRIS_URL=${IRIS_URL:-http://10.0.0.99:3170}
      - AI_FILTER_MODE=${AI_FILTER_MODE:-hybrid}
    ports:
      - "${GUI_PORT:-3334}:${GUI_PORT:-3334}"
    volumes:
      - ./data:/data
      - ./apk:/apk:ro
      - ./secrets:/secrets:ro
